services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER:-rip}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-rip_pass}
      POSTGRES_DB: ${PG_DATABASE:-ripdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_pass}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neodata:/data

volumes:
  pgdata:
  neodata:
